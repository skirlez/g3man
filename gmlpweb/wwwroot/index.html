<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>gmlpweb</title>
        <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
        <link rel="stylesheet" href="css/app.css" />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link href="gmlpweb.styles.css" rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://unpkg.com/@highlightjs/cdn-assets@11.11.1/styles/atom-one-dark.min.css"
        />
    </head>

    <body>
        <header>
            <span id="title">gmlp<sup>web</sup></span>
            <a href="https://github.com/skirlez/g3man"
                ><img src="static/github-mark-white.svg" alt="GitHub Logo"
            /></a>
        </header>
        <main id="app">
            <section id="editors">
                <div class="displayTitle">
                    GMLPv2 Patch
                </div>
                <div id="patchEditor"></div>
                <div class="displayTitle">
                    Source Code
                </div>
                <div id="codeEditor"></div>
            </section>
            <section id="output">
                <article id="patchedCodeContainer">
                    <article id="options">
                        <div class="displayTitle">
                            Result
                        </div>
                        <input type="radio" id="patch" name="options" />
                        <label for="patch">Just patch</label>
                        <input
                            type="radio"
                            id="decompile"
                            name="options"
                            checked
                        />
                        <label for="decompile">Compile and decompile</label>
                        <input type="radio" id="disassemble" name="options" />
                        <label for="disassemble">Compile and disassemble</label>
                    </article>
                    <div id="patchedCodeEditor"></div>
                </article>
                <code style="white-space: pre-line" id="terminal">All quiet on the western front. </code>
            </section>
        </main>
        <div id="blazor-error-ui">
            An unhandled error has occurred.
            <a href="" class="reload">Reload</a>
            <a class="dismiss">🗙</a>
        </div>
        <script src="ace-editor/src-min/ace.js" type="text/javascript" charset="utf-8"></script>
        <script src="_framework/blazor.webassembly.js"></script>
        <script src="main.js"></script>
        <script src="https://unpkg.com/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
        <script src="https://unpkg.com/@highlightjs/cdn-assets@11.11.1/languages/gml.min.js"></script>
        <script src="https://unpkg.com/@highlightjs/cdn-assets@11.11.1/languages/javascript.min.js"></script>
    </body>
</html>
